name: update-lists

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build lists
        run: python harvester.py

      - name: Commit results
        run: |
          git config user.name "harvester-bot"
          git config user.email "harvester-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update lists"
          git push
